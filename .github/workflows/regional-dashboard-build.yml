name: Regional dashboard build
on:
  push:
    branches: [main]
    paths:
      - "projects/regional-ops-dashboard/**"
      - ".github/workflows/regional-dashboard-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "projects/regional-ops-dashboard/**"
      - ".github/workflows/regional-dashboard-build.yml"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/regional-ops-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
