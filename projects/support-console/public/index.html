<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Support Console</title><link rel="stylesheet" href="./styles.css"></head>
<body><main class="shell"><header><div><span class="eyebrow">CUSTOMER OPERATIONS</span><h1>Support Console</h1></div><span id="status" class="status">Desconectado</span></header>
<section id="login" class="login card"><h2>Acceso del equipo</h2><p>Ingresa la clave local compartida para abrir la bandeja de soporte.</p><form id="login-form"><label>Clave del espacio<input name="key" type="password" required autocomplete="current-password"></label><label>Nombre de agente<input name="sender" required maxlength="40" autocomplete="nickname"></label><button>Entrar a la bandeja</button></form><p id="login-error" role="alert"></p></section>
<section id="console" class="card console" hidden><div id="messages" class="messages" aria-live="polite"></div><form id="message-form"><label class="sr-only" for="message">Mensaje</label><input id="message" name="text" maxlength="1000" required placeholder="Escribe una actualización para el equipo"><button>Enviar</button></form><p class="hint">Mensajes guardados en este dispositivo de demostración. Evita información sensible.</p></section></main><script src="./app.js"></script></body></html>
